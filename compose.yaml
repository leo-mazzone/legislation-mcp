services:
  legislation:
    build: .
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      BIND_ADDR: "0.0.0.0:8080"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
