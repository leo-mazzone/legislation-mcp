[package]
name = "uk-legislation-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
axum = "=0.8.6"
quick-xml = "=0.38.3"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
rmcp = { version = "=0.8.1", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }

[dev-dependencies]
rmcp = { version = "=0.8.1", features = ["client", "transport-streamable-http-client-reqwest"] }

